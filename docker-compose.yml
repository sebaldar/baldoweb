services:
  db:
    image: mariadb:11
    container_name: baldo-mariadb
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - ./data/mysql:/var/lib/mysql

  neo4j:
    image: neo4j:5.15-community
    container_name: baldo-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - ./data/neo4j:/data

  mongodb:
    image: mongo:7
    container_name: baldo-mongodb
    restart: always
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./data/mongo:/data/db
      
  qdrant:
    image: qdrant/qdrant:v1.13.0   # compatibile con client 1.17.x
    container_name: baldo-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333" # Accessibile solo localmente sulla VM
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
            
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: baldo-fastapi
    restart: always
    depends_on:
      - neo4j
      - db
      - mongodb
    env_file: .env
    volumes:
      - ./fastapi/logs:/app/logs
      - ./fastapi/stories:/app/stories
      - ./fastapi/config_data:/app/config_data
    mem_limit: 512m
    

  fastapi-planetarium:
    build:
      context: ./fastapi-planetarium
      dockerfile: Dockerfile
    container_name: baldo-fastapi-planetarium
    restart: always
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: ./fastapi-planetarium/.env
    volumes:
      - ./fastapi-planetarium/logs:/app/logs
    mem_limit: 2g        # sentence-transformers è più pesante del fastapi normale
    ports:
      - "127.0.0.1:8001:8000"    
    

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baldo-app
    restart: always
    depends_on:
      - db
      - neo4j
      - fastapi
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3002"
    volumes:
      - ./session:/app/server/session
      - ./server/logs:/app/server/logs
      - ./ssl:/app/ssl
      - ./data/planetarium_assets:/app/data/planetarium
      - ./ilpiccolobardo/public:/app/ilpiccolobardo/public
      
